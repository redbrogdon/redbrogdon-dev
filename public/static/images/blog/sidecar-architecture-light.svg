<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="100%" height="100%">
  
    <defs>
      <marker id="arrow-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#78716c" />
      </marker>
      <marker id="arrow-red-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#991b1b" />
      </marker>
      <marker id="arrow-teal-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d6a78" />
      </marker>
      <marker id="arrow-gold-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#b45309" />
      </marker>
    </defs>
    
  <rect width="820" height="420" fill="#fbf9f4" />

  <text x="36" y="44" font-family="'EB Garamond', Garamond, Georgia, serif" font-size="24" font-weight="600" fill="#1c1917">Deterministic &amp; Agentic Sidecar Architecture</text>
  <text x="36" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#78716c">ADR-002 · Multi-Source Feed Ingestion with LLM Synthesis</text>
  <line x1="36" y1="84" x2="784" y2="84" stroke="#d6d0c4" stroke-width="1" />

  <!-- Stage 1: Deterministic Engine -->
  <g transform="translate(36, 120)">
    <rect width="748" height="105" rx="2" fill="#f4f1ea" stroke="#d6d0c4" stroke-width="1.2" />
    <circle cx="20" cy="22" r="4" fill="#2d6a78" />
    <text x="32" y="26" font-family="'JetBrains Mono', Menlo, Monaco, 'Courier New', monospace" font-size="11" font-weight="700" fill="#2d6a78">DETERMINISTIC ENGINE · PYTHON RUNTIME</text>
    
    <text x="20" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1917">1. Scrape &amp; Deduplicate</text>
    <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#78716c">Periodic cron polling of Atom/RSS feeds and YouTube HTML. Verifies author attribution.</text>
    <text x="20" y="92" font-family="'JetBrains Mono', Menlo, Monaco, 'Courier New', monospace" font-size="10.5" fill="#78716c">blog.flutter.dev · dart.dev/blog · youtube.com/@flutterdev</text>
  </g>

  <!-- Transition Arrow -->
  <line x1="410" y1="225" x2="410" y2="260" stroke="#991b1b" stroke-width="1.5" marker-end="url(#arrow-red-light)" />
  <rect x="330" y="235" width="160" height="20" rx="2" fill="#fbf4f2" stroke="#991b1b" stroke-width="0.8" />
  <text x="410" y="249" font-family="'JetBrains Mono', Menlo, Monaco, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle">NEW MEDIA DETECTED</text>

  <!-- Stage 2: Agentic Synthesis -->
  <g transform="translate(36, 265)">
    <rect width="748" height="115" rx="2" fill="#fbf4f2" stroke="#991b1b" stroke-width="1.5" />
    <circle cx="20" cy="22" r="4" fill="#991b1b" />
    <text x="32" y="26" font-family="'JetBrains Mono', Menlo, Monaco, 'Courier New', monospace" font-size="11" font-weight="700" fill="#991b1b">AGENTIC SYNTHESIS · GEMINI 3.8 FLASH</text>
    
    <text x="20" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c1917">2. Synthesize &amp; Commit</text>
    <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1c1917">Generates 1–2 sentence editorial summary in the Monograph voice, mints RS256 JWT, and creates PR.</text>
    <text x="20" y="96" font-family="'JetBrains Mono', Menlo, Monaco, 'Courier New', monospace" font-size="10.5" fill="#991b1b">public/media/index.html · public/feed.xml · public/sitemap.xml</text>
  </g>
</svg>
